# 검토할 저장소 루트에 .rulefirst.toml 로 두면 기본값을 덮어쓴다. 필요한 항목만 적으면 된다.

# 불러올 규칙팩. rules/ 아래 이름이나 파일 경로.
packs = ["core"]
# packs = ["core", "examples/layered-spring.toml", "D:/team-rules/our-pack.toml"]

# 이 등급 이상 지적이 있으면 종료 코드 1(보류)
fail_on = "high"

# 검사에서 뺄 경로
exclude = [
  "**/.git/**", "**/node_modules/**", "**/build/**", "**/target/**",
  "**/dist/**", "**/out/**", "**/.gradle/**", "**/*.min.js",
  # "**/generated/**",
]

[test]
source_globs = ["**/src/main/java/**/*.java"]
test_suffixes = ["Test", "Tests", "IT"]
ignore_globs = ["**/package-info.java", "**/*Application.java", "**/*Config.java", "**/*Dto.java", "**/*Vo.java"]

[e2e]
harness_globs = ["**/e2e/**", "**/*e2e*.py", "**/*.spec.ts", "**/*.spec.js", "**/*.cy.js"]

[llm]
endpoint = ""                 # 예: http://127.0.0.1:8080/v1  (비우면 모델 층 꺼짐)
model = ""
perspectives = ["security", "ux", "test"]
context_lines = 30            # 바뀐 줄 앞뒤로 보낼 줄 수
max_chars = 6000              # 호출 1회 코드 조각 상한
timeout = 300                 # 초
allow_remote = false          # true 면 로컬이 아닌 주소도 허용 (코드가 PC 밖으로 나간다)
