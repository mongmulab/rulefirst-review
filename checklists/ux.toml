perspective = "ux"
files = ["*.html", "*.jsp", "*.js", "*.ts", "*.jsx", "*.tsx", "*.vue"]
exclude_files = ["**/test/**", "*.spec.*", "*.test.*", "*.min.js"]
system = "너는 사용자 경험 체크리스트 판정기다. 화면 코드 조각만 보고 판정한다."

[[item]]
id = "U1"
severity = "medium"
title = "실패해도 사용자에게 알리지 않는다"
question = "서버 요청(fetch, ajax, axios 등)의 실패 처리가 없거나, 실패 시 화면에 아무 안내도 하지 않는가?"

[[item]]
id = "U2"
severity = "medium"
title = "오래 걸리는 작업에 진행 표시가 없다"
question = "조회·저장·다운로드처럼 시간이 걸리는 요청 중에 로딩 표시나 버튼 비활성화가 없어 중복 클릭이 가능한가?"

[[item]]
id = "U3"
severity = "low"
title = "빈 결과를 안내하지 않는다"
question = "조회 결과가 0건일 때 '결과 없음' 같은 안내 없이 빈 화면만 남는가?"

[[item]]
id = "U4"
severity = "low"
title = "오류 문구가 사용자가 행동할 수 없는 내용이다"
question = "사용자에게 보이는 오류 문구가 코드값·영문 예외명만 있고 무엇을 해야 하는지 알려 주지 않는가?"

[[item]]
id = "U5"
severity = "low"
title = "입력 요소에 레이블이 없다"
question = "input, select, button 에 보이는 레이블이나 aria-label 이 없는 것이 있는가?"
